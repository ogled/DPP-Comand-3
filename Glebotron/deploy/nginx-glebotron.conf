# Глеботрон: glebotron.cosmos1562.space → gunicorn 127.0.0.1:5001.
# Ставится install.sh в /etc/nginx/sites-available/glebotron. Файл в репозитории — основной:
# сертификат выпускается через certbot certonly и этот конфиг не правит.
limit_req_zone $binary_remote_addr zone=glb_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=glb_api:10m rate=10r/s;

server {
    listen 80;
    server_name glebotron.cosmos1562.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name glebotron.cosmos1562.space;

    ssl_certificate     /etc/letsencrypt/live/glebotron.cosmos1562.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glebotron.cosmos1562.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    # собранный фронтенд: файлы в assets/ с хэшем в имени, их можно кешировать навсегда
    location /static/assets/ {
        alias /opt/glebotron/app/static/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        alias /opt/glebotron/app/static/;
        expires 1h;
    }

    location ~ ^/api/(login|register)$ {
        limit_req zone=glb_auth burst=5 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://127.0.0.1:5001;
    }

    # ЦУП: пачки кадров downlink крупнее обычных запросов
    location /gs/ {
        client_max_body_size 256k;
        include proxy_params;
        proxy_pass http://127.0.0.1:5001;
    }

    location / {
        limit_req zone=glb_api burst=40 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://127.0.0.1:5001;
    }
}
