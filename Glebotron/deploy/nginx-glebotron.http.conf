# Глеботрон до выпуска сертификата: только HTTP, нужен certbot для проверки домена.
# install.sh заменит этот файл на nginx-glebotron.conf, когда появится сертификат.
server {
    listen 80;
    server_name glebotron.cosmos1562.space;
    client_max_body_size 16k;

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:5001;
    }
}
