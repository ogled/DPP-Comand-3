<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPP — наземная станция</title>
<script>try{var t=localStorage.getItem("theme");t=t==="dark"?"night":t==="light"?"day":t;t=t||(matchMedia("(prefers-color-scheme: dark)").matches?"night":"day");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="day"}</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
