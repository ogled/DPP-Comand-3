; ESP32-S3 N8R2 web terminal on top of the Nano (nano/), which keeps the E32.
; Wiring (radio.h):
;   GPIO18 -> Nano D0 (RX)
;   Nano D1 (TX) -> 10k -> GPIO17, and GPIO17 -> 20k -> GND (the Nano is 5 V)
;   GND - GND
[env:esp32s3_n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps = bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; the Nano + ESP bundle is terminal 0001 (the Nano sends as "1" too)
    -DDEFAULT_TERMINAL=1
