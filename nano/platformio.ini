; Clone Nanos ship with one of two bootloaders. If an upload says "not in sync",
; try the other env.
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor

; old bootloader (57600 baud)
[env:nano_old]
extends = env:nano
board = nanoatmega328
