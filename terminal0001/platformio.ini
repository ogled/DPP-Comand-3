[platformio]
default_envs = bluepill

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
board_build.core = stm32
upload_protocol = hid
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
lib_deps = adafruit/Adafruit BME280 Library@^2.2.4
monitor_speed = 9600

; fallback: flash over ST-Link (overwrites HID bootloader)
[env:bluepill_stlink]
extends = env:bluepill
upload_protocol = stlink