; Terminal 0002: ESP32-S3 N16R8 with its own E32 (RX 1, TX 2, AUX 14, 9600).
; No internet: only its own access point, no Wi-Fi client, no site link.
; What it sends for people on the site goes up through the payload.
[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps = bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRADIO_RX=1
    -DRADIO_TX=2
    -DRADIO_AUX=14
    -DDEFAULT_TERMINAL=2
